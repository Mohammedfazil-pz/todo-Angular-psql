<div class="home-container">
    <div class="home-row">
        <h1>Todos</h1>
        <input type="text" placeholder="What do you need to do?" [(ngModel)]="inputValue" name="inputValue" (keydown.enter)="onInput()">
            <!-- <button id="task-addbtn">Add <i class="fa-solid fa-plus"></i></button> -->
        <div class="home-list">
            <div class="home-list-container" *ngFor="let eachTask of taskArray">
                <div>
                    <input checked="false" type="checkbox" >
                    <h2>{{eachTask.task}}</h2>
                </div>
                <div>
                    <button (click)="onDeleteTask(eachTask.id)"><i class="fa-solid fa-trash"></i></button>
                    <button (click)="ModalValue(eachTask)" data-bs-toggle="modal" data-bs-target="#exampleModal"><i class="fa-solid fa-pen-to-square"></i></button>
                </div>
            </div>
        
            
        </div>
    </div>
</div>


<!-- modal -->
<!-- Modal -->

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Todo list edit</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
       <input class="form-control" type="text" [value]="modalTask?.task" #modalinp>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" (click)="onUpdateClick(modalinp)">Save changes</button>
      </div>
    </div>
  </div>
</div>
